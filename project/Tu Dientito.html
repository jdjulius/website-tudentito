<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tu Dientito · Clínica Dental Pediátrica · San Lucas Sacatepéquez</title>
<meta name="description" content="Clínica Dental Tu Dientito — odontopediatría con cariño en San Lucas Sacatepéquez. Cuidamos tus dientes como a tus niños." />
<meta name="theme-color" content="#B3E5FC" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --celeste-50:   #F1FAFE;
    --celeste-100:  #E1F4FC;
    --celeste-200:  #B3E5FC;
    --celeste-300:  #81D4FA;
    --celeste-400:  #4FC3F7;
    --celeste-500:  #29B6F6;
    --ink-900:      #0A3D5C;
    --ink-700:      #1F4C68;
    --ink-500:      #547189;
    --ink-300:      #8FA4B5;
    --cream:        #FBFDFE;
    --paper:        #F4FAFD;
    --line:         #E6F1F7;
    --whatsapp:     #25D366;
    --whatsapp-dk:  #128C4F;
    --shadow-sm: 0 1px 2px rgba(10,61,92,.05), 0 2px 8px rgba(10,61,92,.04);
    --shadow-md: 0 4px 16px rgba(10,61,92,.07), 0 12px 32px rgba(10,61,92,.06);
    --shadow-lg: 0 12px 32px rgba(10,61,92,.10), 0 32px 64px rgba(10,61,92,.08);
    --radius-sm: 14px;
    --radius:    22px;
    --radius-lg: 32px;
    --font-display: "Bricolage Grotesque", system-ui, sans-serif;
    --font-body:    "Nunito", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink-900);
    background: var(--cream);
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--celeste-200); color: var(--ink-900); }

  h1, h2, h3, h4 {
    font-family: var(--font-display);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin: 0;
    color: var(--ink-900);
    text-wrap: balance;
  }

  p { margin: 0; text-wrap: pretty; }

  a { color: inherit; text-decoration: none; }

  button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }

  .container {
    width: 100%;
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 clamp(20px, 4vw, 48px);
  }

  /* =================== NAV =================== */
  .nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 50;
    padding: 14px 0;
    transition: background .35s ease, box-shadow .35s ease, padding .25s ease;
  }
  .nav.scrolled {
    background: rgba(251,253,254,.85);
    backdrop-filter: saturate(1.2) blur(14px);
    -webkit-backdrop-filter: saturate(1.2) blur(14px);
    box-shadow: 0 1px 0 rgba(10,61,92,.06);
    padding: 10px 0;
  }
  .nav-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
  }
  .brand {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 19px;
    letter-spacing: -0.02em;
  }
  .brand-mark {
    width: 38px; height: 38px;
    display: grid; place-items: center;
    background: var(--celeste-200);
    border-radius: 50%;
    color: var(--ink-900);
  }
  .brand-name b { font-weight: 800; }
  .brand-name span { display: block; font-size: 11px; font-weight: 600; color: var(--ink-500); letter-spacing: 0.06em; text-transform: uppercase; margin-top: -2px; }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 6px;
    list-style: none;
    margin: 0; padding: 0;
  }
  .nav-links a {
    padding: 9px 14px;
    font-weight: 600;
    color: var(--ink-700);
    border-radius: 999px;
    transition: background .2s, color .2s;
    font-size: 15px;
  }
  .nav-links a:hover { background: var(--celeste-100); color: var(--ink-900); }

  .nav-cta {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--ink-900);
    color: var(--cream);
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    transition: transform .2s, background .2s;
  }
  .nav-cta:hover { transform: translateY(-1px); background: #073149; }

  .menu-btn {
    display: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    background: var(--celeste-100);
    place-items: center;
  }
  .menu-btn svg { width: 22px; height: 22px; stroke: var(--ink-900); }

  /* =================== HERO =================== */
  .hero {
    position: relative;
    min-height: 100vh;
    min-height: 100svh;
    padding: 120px 0 80px;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .hero-bg {
    position: absolute; inset: 0;
    z-index: 0;
    overflow: hidden;
  }
  .hero-bg video, .hero-bg .hero-still {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1.08);
    animation: heroPan 14s ease-in-out infinite alternate;
  }
  .hero-still { background-size: cover; background-position: center; }
  @keyframes heroPan {
    0%   { transform: scale(1.08) translate(0, 0); }
    100% { transform: scale(1.18) translate(-2%, -1%); }
  }
  .hero-bg::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 70% at 0% 60%, rgba(251,253,254,.85) 0%, rgba(251,253,254,.55) 35%, rgba(251,253,254,0) 70%),
      linear-gradient(180deg, rgba(251,253,254,.5) 0%, rgba(251,253,254,0) 30%, rgba(251,253,254,.35) 100%);
  }

  .hero-inner {
    position: relative;
    z-index: 2;
    max-width: 720px;
  }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px 8px 8px;
    background: rgba(251,253,254,.7);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(10,61,92,.08);
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-700);
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }
  .eyebrow .dot {
    width: 22px; height: 22px;
    background: var(--celeste-200);
    border-radius: 50%;
    display: grid; place-items: center;
    color: var(--ink-900);
    font-size: 13px;
  }
  .hero h1 {
    font-size: clamp(42px, 6.4vw, 86px);
    margin-bottom: 22px;
  }
  .hero h1 .accent {
    background: linear-gradient(180deg, var(--celeste-400) 0%, var(--celeste-500) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-style: italic;
    font-weight: 700;
  }
  .hero .lede {
    font-size: clamp(17px, 1.6vw, 19px);
    color: var(--ink-700);
    max-width: 540px;
    margin-bottom: 36px;
  }
  .hero-ctas {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 18px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 16px;
    transition: transform .25s cubic-bezier(.2,.8,.3,1.2), box-shadow .25s, background .2s;
    box-shadow: var(--shadow-sm);
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .btn:active { transform: translateY(0); }
  .btn-whatsapp {
    background: var(--whatsapp);
    color: white;
  }
  .btn-whatsapp:hover { background: #1FB95A; }
  .btn-primary {
    background: var(--ink-900);
    color: var(--cream);
  }
  .btn-primary:hover { background: #062E45; }
  .btn-celeste {
    background: var(--celeste-200);
    color: var(--ink-900);
  }
  .btn-celeste:hover { background: var(--celeste-300); }
  .btn-ghost {
    background: transparent;
    color: var(--ink-900);
    border: 1.5px solid rgba(10,61,92,.15);
    box-shadow: none;
  }
  .btn-ghost:hover { background: var(--celeste-100); border-color: rgba(10,61,92,.25); }

  .hero-meta {
    margin-top: 56px;
    display: flex;
    gap: 36px;
    flex-wrap: wrap;
  }
  .hero-meta .mt {
    display: flex; flex-direction: column;
  }
  .hero-meta .mt b {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    color: var(--ink-900);
    line-height: 1;
  }
  .hero-meta .mt span {
    font-size: 13px;
    color: var(--ink-500);
    font-weight: 600;
    margin-top: 4px;
  }
  .hero-meta .sep {
    width: 1px;
    background: rgba(10,61,92,.12);
  }

  .hero-card {
    position: absolute;
    z-index: 3;
    right: clamp(20px, 4vw, 48px);
    bottom: clamp(20px, 4vw, 60px);
    background: rgba(251,253,254,.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 18px 20px;
    border-radius: var(--radius);
    box-shadow: var(--shadow-md);
    border: 1px solid rgba(10,61,92,.06);
    max-width: 280px;
    display: flex;
    gap: 14px;
    align-items: center;
    animation: floatY 5s ease-in-out infinite alternate;
  }
  @keyframes floatY {
    0% { transform: translateY(0); }
    100% { transform: translateY(-8px); }
  }
  .hero-card .av {
    width: 46px; height: 46px;
    background: var(--celeste-200);
    border-radius: 50%;
    display: grid; place-items: center;
    flex-shrink: 0;
  }
  .hero-card b { font-weight: 800; display: block; font-size: 14px; }
  .hero-card span { font-size: 12px; color: var(--ink-500); display: block; line-height: 1.4; }

  /* =================== SECTION =================== */
  section { padding: clamp(80px, 10vw, 140px) 0; position: relative; }
  .sec-head {
    display: flex; flex-direction: column;
    gap: 18px;
    margin-bottom: 60px;
    max-width: 720px;
  }
  .sec-tag {
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 700;
    color: var(--celeste-500);
    letter-spacing: 0.16em;
    text-transform: uppercase;
    display: inline-flex; align-items: center; gap: 10px;
  }
  .sec-tag::before {
    content: ""; width: 32px; height: 2px;
    background: var(--celeste-300); border-radius: 2px;
  }
  .sec-head h2 {
    font-size: clamp(36px, 5vw, 60px);
  }
  .sec-head .sec-sub {
    color: var(--ink-500);
    font-size: 18px;
    max-width: 620px;
  }

  /* =================== SERVICES =================== */
  #servicios {
    background: linear-gradient(180deg, var(--cream) 0%, var(--paper) 100%);
  }
  .services-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
  }
  .svc-card {
    background: white;
    border-radius: var(--radius-lg);
    padding: 30px 26px 32px;
    border: 1px solid var(--line);
    box-shadow: var(--shadow-sm);
    display: flex;
    flex-direction: column;
    gap: 18px;
    position: relative;
    overflow: hidden;
    transition: transform .35s cubic-bezier(.2,.8,.3,1), box-shadow .35s, border-color .35s;
    min-height: 320px;
  }
  .svc-card::before {
    content: "";
    position: absolute;
    inset: -40% -40% auto auto;
    width: 180px; height: 180px;
    background: var(--svc-bg, var(--celeste-100));
    border-radius: 50%;
    opacity: .6;
    transition: transform .5s cubic-bezier(.2,.8,.3,1);
    z-index: 0;
  }
  .svc-card > * { position: relative; z-index: 1; }
  .svc-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-md);
    border-color: var(--svc-bg, var(--celeste-200));
  }
  .svc-card:hover::before { transform: scale(1.25) rotate(15deg); }

  .svc-icon {
    width: 60px; height: 60px;
    border-radius: 18px;
    background: var(--svc-bg, var(--celeste-100));
    display: grid; place-items: center;
    color: var(--ink-900);
  }
  .svc-icon svg { width: 30px; height: 30px; }
  .svc-card h3 {
    font-size: 22px;
    font-weight: 800;
  }
  .svc-card p {
    color: var(--ink-500);
    font-size: 15px;
    flex-grow: 1;
  }
  .svc-card .svc-tag {
    font-size: 12px;
    font-weight: 700;
    color: var(--ink-700);
    background: var(--svc-bg, var(--celeste-100));
    padding: 5px 12px;
    border-radius: 999px;
    display: inline-block;
    align-self: flex-start;
  }

  /* =================== WHY US =================== */
  #nosotros {
    background: var(--cream);
  }
  .why-wrap {
    display: grid;
    grid-template-columns: 1fr 1.05fr;
    gap: clamp(40px, 6vw, 80px);
    align-items: center;
  }
  .why-img-stack {
    position: relative;
    aspect-ratio: 4/5;
  }
  .why-img-stack .wi {
    position: absolute;
    border-radius: var(--radius-lg);
    overflow: hidden;
    box-shadow: var(--shadow-md);
  }
  .why-img-stack .wi-1 {
    width: 70%; aspect-ratio: 3/4;
    top: 0; left: 0;
    z-index: 2;
  }
  .why-img-stack .wi-2 {
    width: 60%; aspect-ratio: 4/3;
    bottom: 0; right: 0;
    z-index: 3;
    border: 6px solid var(--cream);
  }
  .why-img-stack .wi img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .why-img-stack .wi-badge {
    position: absolute;
    z-index: 4;
    top: 30%; right: 10%;
    background: var(--ink-900);
    color: var(--cream);
    padding: 16px 20px;
    border-radius: var(--radius);
    text-align: center;
    box-shadow: var(--shadow-lg);
    transform: rotate(-6deg);
  }
  .why-img-stack .wi-badge b {
    display: block;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 28px;
    line-height: 1;
  }
  .why-img-stack .wi-badge span {
    font-size: 11px;
    color: var(--celeste-200);
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .why-list {
    display: flex; flex-direction: column;
    gap: 8px;
    margin-top: 24px;
  }
  .why-item {
    display: grid;
    grid-template-columns: 56px 1fr;
    gap: 22px;
    padding: 22px 4px;
    border-bottom: 1px solid var(--line);
    transition: padding .25s;
  }
  .why-item:last-child { border-bottom: 0; }
  .why-item:hover { padding-left: 12px; }
  .why-num {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--celeste-100);
    color: var(--ink-900);
    display: grid; place-items: center;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    transition: background .3s, color .3s;
  }
  .why-item:hover .why-num { background: var(--celeste-300); }
  .why-item h4 {
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
  }
  .why-item p {
    color: var(--ink-500);
    font-size: 15.5px;
  }

  /* =================== CONTACT =================== */
  #contacto {
    background: linear-gradient(180deg, var(--paper) 0%, var(--celeste-50) 100%);
  }
  .contact-grid {
    display: grid;
    grid-template-columns: 1.05fr 1fr;
    gap: clamp(32px, 5vw, 64px);
    align-items: stretch;
  }
  .contact-info-card {
    background: var(--ink-900);
    color: var(--cream);
    border-radius: var(--radius-lg);
    padding: clamp(36px, 4.5vw, 52px);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .contact-info-card::before {
    content: "";
    position: absolute;
    bottom: -120px; right: -120px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(179,229,252,.25) 0%, rgba(179,229,252,0) 70%);
  }
  .contact-info-card h3 {
    color: var(--cream);
    font-size: 32px;
  }
  .contact-info-card p.intro {
    color: rgba(251,253,254,.75);
    max-width: 380px;
  }
  .contact-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 18px; position: relative; }
  .contact-list li {
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 16px;
    align-items: center;
  }
  .contact-list .ci-icon {
    width: 44px; height: 44px;
    border-radius: 14px;
    background: rgba(179,229,252,.15);
    color: var(--celeste-200);
    display: grid; place-items: center;
  }
  .contact-list svg { width: 20px; height: 20px; }
  .contact-list b { font-size: 16px; font-weight: 700; color: var(--cream); display: block; }
  .contact-list span { font-size: 13px; color: rgba(251,253,254,.65); }
  .map-frame {
    margin-top: auto;
    border-radius: var(--radius);
    overflow: hidden;
    aspect-ratio: 16/9;
    background: var(--celeste-200) center/cover no-repeat;
    background-image:
      linear-gradient(135deg, rgba(10,61,92,.15) 0%, transparent 50%),
      radial-gradient(circle at 40% 50%, rgba(255,255,255,.4) 0%, transparent 30%),
      linear-gradient(180deg, #B3E5FC 0%, #81D4FA 100%);
    position: relative;
    border: 1px solid rgba(179,229,252,.2);
  }
  .map-frame .map-pin {
    position: absolute;
    top: 45%; left: 50%;
    transform: translate(-50%, -100%);
    width: 36px; height: 36px;
    background: var(--ink-900);
    border-radius: 50% 50% 50% 0;
    rotate: -45deg;
    display: grid; place-items: center;
    box-shadow: 0 8px 24px rgba(10,61,92,.4);
    animation: pinBounce 2s ease-in-out infinite;
  }
  .map-frame .map-pin::after {
    content: "";
    width: 10px; height: 10px; background: var(--celeste-200);
    border-radius: 50%;
  }
  @keyframes pinBounce {
    0%, 100% { transform: translate(-50%, -100%); }
    50% { transform: translate(-50%, -115%); }
  }
  .map-frame .map-label {
    position: absolute;
    bottom: 12px; left: 12px; right: 12px;
    background: rgba(251,253,254,.95);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-900);
    text-align: center;
    backdrop-filter: blur(8px);
  }

  .contact-form-card {
    background: white;
    border-radius: var(--radius-lg);
    padding: clamp(32px, 4vw, 48px);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-md);
    display: flex;
    flex-direction: column;
    gap: 18px;
  }
  .contact-form-card h3 { font-size: 28px; }
  .contact-form-card p.sub { color: var(--ink-500); margin-bottom: 8px; }
  .form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-size: 13px;
    font-weight: 700;
    color: var(--ink-700);
  }
  .field input, .field select, .field textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    color: var(--ink-900);
    background: var(--paper);
    border: 1.5px solid transparent;
    border-radius: 14px;
    padding: 14px 16px;
    transition: border-color .2s, background .2s;
    resize: none;
  }
  .field textarea { min-height: 100px; }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none;
    background: white;
    border-color: var(--celeste-300);
  }
  .field.error input, .field.error select, .field.error textarea {
    border-color: #E5736E;
    background: #FCEEED;
  }
  .err-msg {
    font-size: 12px;
    color: #C44A45;
    font-weight: 600;
  }
  .form-success {
    background: linear-gradient(135deg, #DCF7E3 0%, #C9F0D6 100%);
    border-radius: var(--radius);
    padding: 32px 28px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .form-success .check {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--whatsapp);
    color: white;
    display: grid; place-items: center;
    animation: pop .4s cubic-bezier(.2,.8,.3,1.4);
  }
  @keyframes pop {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
  }
  .form-success h4 { font-size: 22px; }
  .form-success p { color: var(--ink-500); font-size: 15px; }

  /* =================== FOOTER =================== */
  footer {
    background: var(--ink-900);
    color: var(--cream);
    padding: 72px 0 24px;
  }
  .foot-grid {
    display: grid;

// ============ REVEAL HOOK ============
function useReveal() {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current) return;
    const els = ref.current.classList.contains("reveal") || ref.current.classList.contains("reveal-stagger")
      ? [ref.current]
      : ref.current.querySelectorAll(".reveal, .reveal-stagger");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add("in");
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: "0px 0px -60px 0px" });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
  return ref;
}

}

function ContactForm() {
  const [data, setData] = useState({ name: "", phone: "", email: "", msg: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  const setField = (k, v) => {
    setData((d) => ({ ...d, [k]: v }));
    if (errors[k]) setErrors((e) => ({ ...e, [k]: null }));
  };

  const onSubmit = (e) => {
    e.preventDefault();
    const next = {};
    if (!data.name.trim()) next.name = "Por favor escribe tu nombre";
    if (!data.phone.trim() || !/^[\d\s+\-()]{7,}$/.test(data.phone)) next.phone = "Teléfono inválido";
    if (data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) next.email = "Email inválido";
    if (!data.msg.trim()) next.msg = "Cuéntanos cómo podemos ayudarte";
    if (Object.keys(next).length) {
      setErrors(next);
      return;
    }
    setSent(true);
  };

  if (sent) {
    return (
      <div className="form-success">
        <div className="check"><Icon id="check" width="32" height="32" /></div>
        <h4>¡Mensaje enviado!</h4>
        <p>Gracias {data.name.split(" ")[0]}, te contactaremos en las próximas horas hábiles. Si es urgente, escríbenos por WhatsApp.</p>
        <a className="btn btn-whatsapp" href={WA_LINK} target="_blank" rel="noopener" style={{ marginTop: 6 }}>
          <Icon id="wa" width="18" height="18" />
          Abrir WhatsApp
        </a>
      </div>
    );
  }

  return (
    <form className="contact-form-card" onSubmit={onSubmit} noValidate>
      <h3>Escríbenos</h3>
      <p className="sub">Te respondemos en menos de 2 horas durante horario de clínica.</p>

      <div className="form-row">
        <div className={`field ${errors.name ? "error" : ""}`}>
          <label htmlFor="f-name">Nombre completo</label>
          <input id="f-name" value={data.name} onChange={(e) => setField("name", e.target.value)} placeholder="María González" />
          {errors.name && <span className="err-msg">{errors.name}</span>}
        </div>
        <div className={`field ${errors.phone ? "error" : ""}`}>
          <label htmlFor="f-phone">Teléfono</label>
          <input id="f-phone" type="tel" value={data.phone} onChange={(e) => setField("phone", e.target.value)} placeholder="5476 4558" />
          {errors.phone && <span className="err-msg">{errors.phone}</span>}
        </div>
      </div>

      <div className={`field ${errors.email ? "error" : ""}`}>
        <label htmlFor="f-email">Correo (opcional)</label>
        <input id="f-email" type="email" value={data.email} onChange={(e) => setField("email", e.target.value)} placeholder="tu@correo.com" />
        {errors.email && <span className="err-msg">{errors.email}</span>}
      </div>

      <div className={`field ${errors.msg ? "error" : ""}`}>
        <label htmlFor="f-msg">¿Cómo podemos ayudarte?</label>
        <textarea id="f-msg" value={data.msg} onChange={(e) => setField("msg", e.target.value)} placeholder="Quisiera agendar una limpieza para mi hijo de 6 años..." />
        {errors.msg && <span className="err-msg">{errors.msg}</span>}
      </div>

      <button type="submit" className="btn btn-primary" style={{ alignSelf: "flex-start", marginTop: 4 }}>
        Enviar mensaje <Icon id="arrow" width="16" height="16" />
      </button>
    </form>
  );
}

// ============ BOOKING MODAL ============
function BookingModal({ open, onClose }) {
  const [step, setStep] = useState(1);
  const [reason, setReason] = useState("");
  const [date, setDate] = useState(null);
  const [time, setTime] = useState(null);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [done, setDone] = useState(false);

  useEffect(() => {
    if (open) {
      document.body.style.overflow = "hidden";
      setStep(1); setReason(""); setDate(null); setTime(null); setName(""); setPhone(""); setDone(false);
    } else {
      document.body.style.overflow = "";
    }
    return () => { document.body.style.overflow = ""; };
  }, [open]);

  if (!open) return null;

  const today = new Date();
  const dates = Array.from({ length: 8 }, (_, i) => {
    const d = new Date(today); d.setDate(d.getDate() + i + 1);
    return d;
  });
  const dayNames = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
  const monthNames = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
  const times = ["09:00", "10:00", "11:00", "12:00", "14:00", "15:00", "16:00", "17:00"];
  const disabledTimes = new Set(["12:00", "16:00"]);

  const reasons = [
    { v: "kids",     l: "Limpieza niños"   },
    { v: "adult",    l: "Limpieza adultos" },
    { v: "ortho",    l: "Brackets / Ortodoncia" },
    { v: "emerg",    l: "Emergencia / dolor" },
    { v: "other",    l: "Otro motivo"      },
  ];

  const finishWhatsapp = () => {
    const dStr = `${dayNames[date.getDay()]} ${date.getDate()} ${monthNames[date.getMonth()]}`;
    const text = `Hola Tu Dientito! 🦷 Quisiera agendar una cita.\n\n• Motivo: ${reasons.find(r=>r.v===reason)?.l}\n• Fecha: ${dStr} a las ${time}\n• Nombre: ${name}\n• Teléfono: ${phone}`;
    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, "_blank");
  };

  const submit = () => {
    setDone(true);
    setTimeout(() => finishWhatsapp(), 500);
  };

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()} role="dialog" aria-labelledby="bk-title">
        <button className="modal-close" onClick={onClose} aria-label="Cerrar"><Icon id="x" /></button>

        {!done ? (
          <>
            <span className="sec-tag" style={{ marginBottom: 10, display: "inline-flex" }}>Paso {step} de 3</span>
            <h3 id="bk-title">{step === 1 ? "¿Qué necesitas?" : step === 2 ? "Elige fecha y hora" : "Tus datos"}</h3>
            <p className="sub">
              {step === 1 && "Cuéntanos brevemente el motivo de tu cita."}
              {step === 2 && "Estos son los espacios disponibles esta semana."}
              {step === 3 && "Último paso. Te confirmamos por WhatsApp."}
            </p>

            {step === 1 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 22 }}>
                {reasons.map((r) => (
                  <button
                    key={r.v}
                    type="button"
                    onClick={() => setReason(r.v)}
                    style={{
                      padding: "16px 18px",
                      background: reason === r.v ? "var(--celeste-200)" : "var(--paper)",
                      borderRadius: 14,
                      border: `1.5px solid ${reason === r.v ? "var(--celeste-400)" : "transparent"}`,
                      textAlign: "left",
                      fontWeight: 700,
                      fontSize: 15,
                      display: "flex", alignItems: "center", justifyContent: "space-between",
                      transition: "all .2s",
                    }}
                  >
                    {r.l}
                    {reason === r.v && <Icon id="check" width="18" height="18" />}
                  </button>
                ))}
              </div>
            )}

            {step === 2 && (
              <>
                <div className="date-grid">
                  {dates.map((d, i) => (
                    <button
                      key={i}
                      type="button"
                      className={`date-pill ${date && d.getDate() === date.getDate() ? "active" : ""}`}
                      onClick={() => setDate(d)}
                    >
                      <b>{d.getDate()}</b>
                      <span>{dayNames[d.getDay()]} · {monthNames[d.getMonth()]}</span>
                    </button>
                  ))}
                </div>
                {date && (
                  <>
                    <label style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-700)", display: "block", marginBottom: 10 }}>
                      Horarios disponibles
                    </label>
                    <div className="time-grid">
                      {times.map((t) => (
                        <button
                          key={t}
                          type="button"
                          className={`time-pill ${disabledTimes.has(t) ? "disabled" : ""} ${time === t ? "active" : ""}`}
                          disabled={disabledTimes.has(t)}
                          onClick={() => setTime(t)}
                        >
                          {t}
                        </button>
                      ))}
                    </div>
                  </>
                )}
              </>
            )}

            {step === 3 && (
              <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 22 }}>
                <div className="field">
                  <label htmlFor="bk-name">Nombre</label>
                  <input id="bk-name" value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre completo" />
                </div>
                <div className="field">
                  <label htmlFor="bk-phone">Teléfono / WhatsApp</label>
                  <input id="bk-phone" type="tel" value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="5476 4558" />
                </div>
                <div style={{ background: "var(--celeste-50)", borderRadius: 14, padding: "14px 16px", fontSize: 14, color: "var(--ink-700)" }}>
                  <b style={{ display: "block", marginBottom: 4 }}>Resumen</b>
                  · {reasons.find(r=>r.v===reason)?.l}<br />
                  · {dayNames[date?.getDay() ?? 0]} {date?.getDate()} {monthNames[date?.getMonth() ?? 0]} a las {time}
                </div>
              </div>
            )}

            <div style={{ display: "flex", gap: 10, justifyContent: "space-between" }}>
              {step > 1 ? (
                <button className="btn btn-ghost" type="button" onClick={() => setStep(step - 1)}>Atrás</button>
              ) : <span />}
              {step < 3 ? (
                <button
                  className="btn btn-primary"
                  type="button"
                  disabled={(step === 1 && !reason) || (step === 2 && (!date || !time))}
                  style={{ opacity: ((step === 1 && !reason) || (step === 2 && (!date || !time))) ? .4 : 1 }}
                  onClick={() => setStep(step + 1)}
                >
                  Continuar <Icon id="arrow" width="16" height="16" />
                </button>
              ) : (
                <button
                  className="btn btn-whatsapp"
                  type="button"
                  disabled={!name.trim() || !phone.trim()}
                  style={{ opacity: (!name.trim() || !phone.trim()) ? .4 : 1 }}
                  onClick={submit}
                >
                  <Icon id="wa" width="18" height="18" />
                  Confirmar por WhatsApp
                </button>
              )}
            </div>
          </>
        ) : (
          <div className="form-success" style={{ marginTop: 0 }}>
            <div className="check"><Icon id="check" width="32" height="32" /></div>
            <h4>¡Cita pre-reservada!</h4>
            <p>Te abrimos WhatsApp para confirmar con el equipo. Si no se abre solo, <a href={WA_LINK} target="_blank" rel="noopener" style={{ color: "var(--whatsapp-dk)", fontWeight: 700 }}>haz clic aquí</a>.</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ============ APP ============
function App() {
  const [bookOpen, setBookOpen] = useState(false);
  const [menuOpen, setMenuOpen] = useState(false);

  // ESC closes modals
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") { setBookOpen(false); setMenuOpen(false); } };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  return (
    <>
      <Nav onBook={() => setBookOpen(true)} onOpenMenu={() => setMenuOpen(true)} />
      <MobileMenu open={menuOpen} onClose={() => setMenuOpen(false)} onBook={() => setBookOpen(true)} />
      <Hero onBook={() => setBookOpen(true)} />
      <Services />
      <WhyUs />
      <Contact />
      <Footer />
      <a className="fab-whatsapp" href={WA_LINK} target="_blank" rel="noopener" aria-label="Contactar por WhatsApp">
        <Icon id="wa" />
      </a>
      <BookingModal open={bookOpen} onClose={() => setBookOpen(false)} />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
